<!doctype html>
<!--
  Octavia's Tidepool Kitchen: a cooking game for desktop browsers, keyboard and mouse.

  Octavia, an eight-armed octopus chef, runs a reef bistro inside a giant clam. Her eight arms
  are the core resource: each holds one item or works a station, and with all eight busy she
  cannot grab or flip. 10 ingredients take different routes through 8 recipes on four kinds
  of station: the Shell Board chops only while an arm works it, an unstirred Bubble Pot burns
  twice as fast, the Vent Grill needs a flip. Cooked food goes raw, PERFECT, overdone, burnt.
  Parts meet on the Clam Plate, get finished (Roll, Ladle...) and cool at the Current Window.

  Perfect, warm, on-time plates raise the Ink Streak (x1 to x3). Perfect takes fill the ink
  meter; I fires a 6 s Ink Burst that freezes patience and speeds the arms. The regulars bend
  the rules and talk: Puffy inflates as she waits, Shelby changes her order, the Seahorse
  Twins want their plates together, Old Tortuga doubles perfect tips, and the critic Madame
  Mantis rates the Grand Reef Platter live. Five tide nights in their own light, Spring Tide
  rushes, 1-3 stars, a Tide Shop, a saved campaign, a first-shift coach, a Reef Gazette.

  Plain ES modules, no libraries, no build: Canvas 2D, WebAudio synthesis, seeded rules on a
  fixed 1/60 s step. It loads only its own modules and makes no network request.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Octavia's Tidepool Kitchen</title>
<style>
  html, body { margin: 0; height: 100%; background: #05191d; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; outline: none; touch-action: none; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" tabindex="0" aria-label="Octavia's Tidepool Kitchen, a cooking game"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
